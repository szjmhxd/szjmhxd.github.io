<h3 id="代码"><a href="#代码" class="headerlink" title="代码"></a>代码</h3><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br></pre></td><td class="code"><pre><span class="line"></span><br><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line"><span class="keyword">import</span> time</span><br><span class="line"> </span><br><span class="line"> </span><br><span class="line"><span class="comment"># 保存截图地址</span></span><br><span class="line">save_path = <span class="string">&#x27;E:\\0\\autoimg\\&#x27;</span></span><br><span class="line"> </span><br><span class="line"><span class="comment"># 定义摄像头对象，其参数0表示第一个摄像头</span></span><br><span class="line">camera = cv2.VideoCapture(<span class="number">1</span>)</span><br><span class="line"><span class="comment"># camera = cv2.VideoCapture(0)</span></span><br><span class="line"><span class="comment"># camera = cv2.VideoCapture(0, cv2.CAP_DSHOW)</span></span><br><span class="line"></span><br><span class="line"> </span><br><span class="line"><span class="comment"># 判断视频是否打开</span></span><br><span class="line"><span class="keyword">if</span> (camera.isOpened()):</span><br><span class="line"> <span class="built_in">print</span>(<span class="string">&#x27;Open&#x27;</span>)</span><br><span class="line"><span class="keyword">else</span>:</span><br><span class="line"> <span class="built_in">print</span>(<span class="string">&#x27;摄像头未打开&#x27;</span>)</span><br><span class="line"> </span><br><span class="line"><span class="comment"># 测试用,查看视频size</span></span><br><span class="line">size = (<span class="built_in">int</span>(camera.get(cv2.CAP_PROP_FRAME_WIDTH)),</span><br><span class="line">  <span class="built_in">int</span>(camera.get(cv2.CAP_PROP_FRAME_HEIGHT)))</span><br><span class="line"><span class="built_in">print</span>(<span class="string">&#x27;size:&#x27;</span>+<span class="built_in">repr</span>(size))</span><br><span class="line"> </span><br><span class="line"><span class="comment"># 帧率</span></span><br><span class="line">fps = <span class="number">30</span></span><br><span class="line"><span class="comment"># 总是取前一帧做为背景（不用考虑环境影响）</span></span><br><span class="line">pre_frame = <span class="literal">None</span></span><br><span class="line"> </span><br><span class="line"><span class="keyword">while</span>(<span class="number">1</span>):</span><br><span class="line"> start = time.time()</span><br><span class="line"> <span class="comment"># 读取视频流</span></span><br><span class="line"> ret, frame = camera.read()</span><br><span class="line"> <span class="comment"># 转灰度图</span></span><br><span class="line"> gray_lwpCV = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)</span><br><span class="line"> </span><br><span class="line"> <span class="keyword">if</span> <span class="keyword">not</span> ret:</span><br><span class="line">  <span class="keyword">break</span></span><br><span class="line"> end = time.time()</span><br><span class="line"> </span><br><span class="line"> cv2.imshow(<span class="string">&quot;capture&quot;</span>, frame)</span><br><span class="line"> </span><br><span class="line"> <span class="comment"># 运动检测部分</span></span><br><span class="line"> seconds = end - start</span><br><span class="line"> <span class="keyword">if</span> seconds &lt; <span class="number">1.0</span> / fps:</span><br><span class="line">  time.sleep(<span class="number">1.0</span> / fps - seconds)</span><br><span class="line"> gray_lwpCV = cv2.resize(gray_lwpCV, (<span class="number">500</span>, <span class="number">500</span>))</span><br><span class="line"> <span class="comment"># 用高斯滤波进行模糊处理</span></span><br><span class="line"> gray_lwpCV = cv2.GaussianBlur(gray_lwpCV, (<span class="number">21</span>, <span class="number">21</span>), <span class="number">0</span>)</span><br><span class="line"> </span><br><span class="line"> <span class="comment"># 如果没有背景图像就将当前帧当作背景图片</span></span><br><span class="line"> <span class="keyword">if</span> pre_frame <span class="keyword">is</span> <span class="literal">None</span>:</span><br><span class="line">  pre_frame = gray_lwpCV</span><br><span class="line"> <span class="keyword">else</span>:</span><br><span class="line">  <span class="comment"># absdiff把两幅图的差的绝对值输出到另一幅图上面来</span></span><br><span class="line">  img_delta = cv2.absdiff(pre_frame, gray_lwpCV)</span><br><span class="line">  <span class="comment">#threshold阈值函数(原图像应该是灰度图,对像素值进行分类的阈值,当像素值高于（有时是小于）阈值时应该被赋予的新的像素值,阈值方法)</span></span><br><span class="line">  thresh = cv2.threshold(img_delta, <span class="number">25</span>, <span class="number">255</span>, cv2.THRESH_BINARY)[<span class="number">1</span>]</span><br><span class="line">  <span class="comment"># 膨胀图像</span></span><br><span class="line">  thresh = cv2.dilate(thresh, <span class="literal">None</span>, iterations=<span class="number">2</span>)</span><br><span class="line">  <span class="comment"># findContours检测物体轮廓(寻找轮廓的图像,轮廓的检索模式,轮廓的近似办法)</span></span><br><span class="line">  contours, hierarchy = cv2.findContours(thresh.copy(), cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)</span><br><span class="line">  <span class="comment"># image, contours, hierarchy = cv2.findContours(thresh.copy(), cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)</span></span><br><span class="line">  <span class="keyword">for</span> c <span class="keyword">in</span> contours:</span><br><span class="line">   <span class="comment"># 设置敏感度</span></span><br><span class="line">   <span class="comment"># contourArea计算轮廓面积</span></span><br><span class="line">   <span class="keyword">if</span> cv2.contourArea(c) &lt; <span class="number">1000</span>:</span><br><span class="line">    <span class="keyword">continue</span></span><br><span class="line">   <span class="keyword">else</span>:</span><br><span class="line">    <span class="comment"># print(&quot;出现目标物，请求核实&quot;)</span></span><br><span class="line">    <span class="comment"># # 保存图像</span></span><br><span class="line">    <span class="comment"># cv2.imwrite(save_path + str(time.strftime(&#x27;%Y-%m-%d %H:%M:%S&#x27;,time.localtime(time.time()))) + &#x27;.jpg&#x27;, frame)</span></span><br><span class="line">    <span class="comment"># print(&quot;抓拍1&quot;)</span></span><br><span class="line"></span><br><span class="line">    cv2.imwrite(save_path + <span class="built_in">str</span>(time.strftime(<span class="string">&#x27;%Y-%m-%d %H_%M_%S&#x27;</span>,time.localtime(time.time()))) + <span class="string">&quot;.jpg&quot;</span>, frame)</span><br><span class="line">    <span class="built_in">print</span>(<span class="string">&quot;抓拍2&quot;</span> + <span class="built_in">str</span>(time.strftime(<span class="string">&#x27;%Y-%m-%d %H_%M_%S&#x27;</span>,time.localtime(time.time()))))</span><br><span class="line"></span><br><span class="line">    <span class="keyword">break</span></span><br><span class="line">  pre_frame = gray_lwpCV</span><br><span class="line"> </span><br><span class="line">  <span class="keyword">if</span> cv2.waitKey(<span class="number">1</span>) &amp; <span class="number">0xFF</span> == <span class="built_in">ord</span>(<span class="string">&#x27;q&#x27;</span>):</span><br><span class="line">   <span class="keyword">break</span></span><br><span class="line"> </span><br><span class="line"> </span><br><span class="line"><span class="comment"># release()释放摄像头</span></span><br><span class="line">camera.release()</span><br><span class="line"><span class="comment">#destroyAllWindows()关闭所有图像窗口</span></span><br><span class="line">cv2.destroyAllWindows()</span><br></pre></td></tr></table></figure>
