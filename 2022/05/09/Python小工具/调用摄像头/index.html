<h2 id="调用电脑摄像头"><a href="#调用电脑摄像头" class="headerlink" title="调用电脑摄像头"></a>调用电脑摄像头</h2><h3 id="环境"><a href="#环境" class="headerlink" title="环境"></a>环境</h3><ul>
<li>Python  3.10.4<span id="more"></span><img src="Python%E7%89%88%E6%9C%AC.png"></li>
<li>库<img src="pip%E5%BA%93.png"></li>
</ul>
<h3 id="代码"><a href="#代码" class="headerlink" title="代码"></a>代码</h3><figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> cv2</span><br><span class="line">cap = cv2.VideoCapture(<span class="number">1</span>) <span class="comment">#设置摄像头 0是默认的摄像头 如果你有多个摄像头的话呢，可以设置1,2,3....</span></span><br><span class="line"><span class="comment"># cap = cv2.VideoCapture(0) #设置摄像头 0是默认的摄像头 如果你有多个摄像头的话呢，可以设置1,2,3....</span></span><br><span class="line"><span class="keyword">while</span> <span class="literal">True</span>:   <span class="comment">#进入无限循环</span></span><br><span class="line">	ret,frame = cap.read() <span class="comment">#将摄像头拍到的图像作为frame值</span></span><br><span class="line">	cv2.imshow(<span class="string">&#x27;frame&#x27;</span>,frame) <span class="comment">#将frame的值显示出来 有两个参数 前一个是窗口名字，后面是值</span></span><br><span class="line">	c = cv2.waitKey(<span class="number">1</span>) <span class="comment">#判断退出的条件 当按下&#x27;Q&#x27;键的时候呢，就退出</span></span><br><span class="line">	<span class="keyword">if</span> c == <span class="built_in">ord</span>(<span class="string">&#x27;q&#x27;</span>):</span><br><span class="line">		<span class="keyword">break</span></span><br><span class="line">cap.release()  <span class="comment">#常规操作</span></span><br><span class="line">cv2.DestroyAllWindows()</span><br></pre></td></tr></table></figure>
