<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1200" height="620" fill="#0e1622"/><text x="40" y="52" font-size="26" font-weight="bold" fill="#e8eef7">横幅 1600×400 的定稿坐标</text><text x="40" y="84" font-size="16" fill="#8fa3bd">#page-header.post-bg 固定 400px 高（移动端 360），background-size: cover；下图按比例缩放显示</text><g transform="translate(60,120) scale(0.675)"><rect width="1600" height="400" fill="url(#bbg)" stroke="#2c3a4d"/><rect x="0" y="0" width="160" height="400" fill="#e5534b" fill-opacity="0.15"/><rect x="1440" y="0" width="160" height="400" fill="#e5534b" fill-opacity="0.15"/><text x="80" y="392" font-size="18" fill="#e5534b" text-anchor="middle">1280 下裁掉</text><text x="1520" y="392" font-size="18" fill="#e5534b" text-anchor="middle">1280 下裁掉</text><rect x="1120" y="100" width="96" height="96" fill="none" stroke="#3fa9f5" stroke-width="3" stroke-dasharray="13 9"/><text x="1168" y="156" font-size="20" fill="#3fa9f5" text-anchor="middle">主 96</text><rect x="1230" y="118" width="66" height="66" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="13 9" stroke-opacity="0.8"/><text x="1263" y="162" font-size="17" fill="#fff" opacity="0.85" text-anchor="middle">副 66</text><rect x="182" y="110" width="5" height="48" fill="#3fa9f5" rx="2.5"/><text x="206" y="148" font-size="40" font-weight="bold" fill="#fff">按 = 出答案</text><text x="208" y="188" font-size="20" fill="#3fa9f5">AutoHotkey v2 · 任意输入框里算算式</text><rect x="0" y="200" width="1600" height="200" fill="#e5534b" fill-opacity="0.13"/><line x1="0" y1="200" x2="1600" y2="200" stroke="#e5534b" stroke-width="2.5" stroke-dasharray="12 8"/><line x1="0" y1="245" x2="1600" y2="245" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.85"/><text x="40" y="232" font-size="22" fill="#e5534b">⚠ y=200：长标题在 1280 宽下折两行时的文字上沿（最严）</text><text x="40" y="272" font-size="20" fill="#ffd166">y=245：短标题始终单行时的上沿（较松）</text><text x="40" y="330" font-size="30" fill="#e5534b" font-weight="bold">自绘内容全部压在 y &lt; 200</text></g><defs><linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1a2b"/><stop offset="100%" stop-color="#132f4d"/></linearGradient></defs><text x="40" y="446" font-size="15" fill="#8fa3bd">矮版：主图标 (1120,100,96)　副 (1230,118,66)　竖条 x182 y110　主标题 x206 y148 fs40　副标题 x208 y188 fs20</text><text x="40" y="470" font-size="15" fill="#8fa3bd">常规版：主图标 (1100,104,128)　副 (1292,126,88)　竖条 x182 y112　主标题 x206 y152 fs44　副标题 x208 y194 fs21</text></svg>