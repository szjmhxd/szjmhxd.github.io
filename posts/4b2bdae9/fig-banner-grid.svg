<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1200" height="560" fill="#0e1622"/><text x="40" y="52" font-size="26" font-weight="bold" fill="#e8eef7">横幅 1600×400 的定稿坐标</text><text x="40" y="84" font-size="16" fill="#8fa3bd">#page-header.post-bg 固定 400px 高（移动端 360），background-size: cover；下图按比例缩放显示</text><g transform="translate(60,120) scale(0.675)"><rect width="1600" height="400" fill="url(#bbg)" stroke="#2c3a4d"/><rect x="1120" y="24" width="175" height="175" fill="none" stroke="#3fa9f5" stroke-width="3" stroke-dasharray="14 10"/><text x="1207" y="122" font-size="26" fill="#3fa9f5" text-anchor="middle">主图标 175</text><rect x="1272" y="116" width="88" height="88" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.8"/><text x="1316" y="166" font-size="22" fill="#fff" opacity="0.85" text-anchor="middle">副 88</text><rect x="130" y="116" width="6" height="58" fill="#3fa9f5" rx="3"/><text x="158" y="160" font-size="44" font-weight="bold" fill="#fff">按 = 出答案</text><text x="160" y="204" font-size="20" fill="#3fa9f5">AutoHotkey v2 · 任意输入框里算算式</text><line x1="130" y1="252" x2="660" y2="252" stroke="#3fa9f5" stroke-opacity="0.35" stroke-width="2"/><rect x="0" y="254" width="1600" height="146" fill="#e5534b" fill-opacity="0.13"/><text x="40" y="316" font-size="26" fill="#e5534b">⚠ 实测：主题标题块占 y≈254 ~ 370（1440 宽下）—— 自绘内容必须全部在 254 以上</text><line x1="0" y1="254" x2="1600" y2="254" stroke="#e5534b" stroke-width="2" stroke-dasharray="12 8"/></g><defs><linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1a2b"/><stop offset="100%" stop-color="#132f4d"/></linearGradient></defs><text x="40" y="446" font-size="15" fill="#8fa3bd">主图标 (1120,24,175)　副图标 (1272,116,88)　竖条 x130 y116 w6 h58　主标题 x158 y160 fs44　副标题 x160 y204 fs20　装饰线 y238</text></svg>