<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1100" height="460" fill="#0e1622"/><text x="40" y="52" font-size="26" font-weight="bold" fill="#e8eef7">两个图标的语义分工</text><text x="40" y="84" font-size="16" fill="#8fa3bd">主图标回答「这篇在讲什么」，副图标回答「这篇对这件事做了什么」</text><rect x="60" y="130" width="460" height="200" rx="10" fill="#141f2e" stroke="#2c3a4d"/><text x="90" y="172" font-size="19" font-weight="bold" fill="#e8eef7">主图标 = 主题官方矢量</text><text x="90" y="204" font-size="14" fill="#8fa3bd">文章讲的主体，必须是官方原图标</text><g transform="translate(380,230)"><rect width="100" height="100" rx="12" fill="none" stroke="#3fa9f5" stroke-width="9"/><text x="50" y="66" font-size="34" fill="#3fa9f5" text-anchor="middle" font-weight="bold">AHK</text></g><rect x="600" y="130" width="460" height="200" rx="10" fill="#141f2e" stroke="#2c3a4d"/><text x="630" y="172" font-size="19" font-weight="bold" fill="#e8eef7">副图标 = 动作语义</text><text x="630" y="204" font-size="14" fill="#8fa3bd">改造 / 修补 / 迁移 / 排查，用同一个语义图标贯穿全站</text><g transform="translate(920,236) scale(0.10)" fill="#ffffff"><path d="M721.92 403.328l160.341333-160.341333-58.581333-58.581334-160.341333 160.384 58.538666 58.538667z m244.650667-160.341333c0 9.813333-3.285333 18.048-9.856 24.618666L252.8 971.477333a33.408 33.408 0 0 1-24.618667 9.856 33.408 33.408 0 0 1-24.618666-9.813333l-108.373334-108.373333A33.408 33.408 0 0 1 85.333333 838.442667c0-9.856 3.285333-18.090667 9.813334-24.618667L799.104 109.952a33.408 33.408 0 0 1 24.618667-9.813333c9.856 0 18.090667 3.242667 24.661333 9.813333l108.373333 108.373333c6.570667 6.570667 9.813333 14.805333 9.813334 24.661334zM227.114667 138.965333l53.632 16.426667-53.632 16.426667-16.426667 53.632-16.426667-53.632-53.632-16.426667 53.632-16.426667L210.688 85.333333l16.426667 53.632z m191.573333 88.661334l107.264 32.853333-107.306667 32.853333-32.853333 107.264-32.810667-107.264-107.264-32.853333 107.264-32.853333 32.853334-107.264 32.853333 107.264z m509.013333 261.632l53.632 16.426666-53.632 16.426667-16.426666 53.632-16.426667-53.632-53.632-16.426667 53.632-16.426666 16.426667-53.632 16.426666 53.632z m-350.293333-350.293334l53.632 16.426667-53.632 16.426667-16.426667 53.632-16.426666-53.632-53.632-16.426667 53.632-16.426667L560.981333 85.333333l16.426667 53.632z"/></g><text x="40" y="386" font-size="16" fill="#e8eef7">反例：把 favicon 当 logo 用</text><text x="40" y="414" font-size="14" fill="#8fa3bd">SnowLuma 的官方 logo 是水彩猫，缩到 95px 丢细节；它的 favicon 又是另一套字标 —— 两者都不是「副图标该放的东西」。</text><text x="40" y="438" font-size="14" fill="#8fa3bd">副图标要选和本文动作对应的形状，而不是「这个项目还有哪些图标没用过」。</text></svg>