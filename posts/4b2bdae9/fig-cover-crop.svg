<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect width="1100" height="640" fill="#0e1622"/><text x="40" y="52" font-size="26" font-weight="bold" fill="#e8eef7">同样是 1200×500 的图，放进 348×269 的卡片框会发生什么</text><text x="40" y="84" font-size="16" fill="#8fa3bd">首页卡片 .post_cover 是 42% 宽 × 16.8em 高，图片按 object-fit: cover 居中裁切</text><text x="60" y="140" font-size="18" fill="#e5534b">✗ 1200×500（比例 2.4 : 1）</text><rect x="60" y="158" width="348" height="269" fill="#1b2534" stroke="#2c3a4d"/><g clip-path="url(#clipL)"><rect x="-88.8" y="158" width="645.6" height="269" fill="#20344c"/><text x="234.0" y="300" font-size="34" font-weight="bold" fill="#5d7dark" text-anchor="middle" fill="#5d7a9c">这是一张 1200×500 的横图</text></g><defs><clipPath id="clipL"><rect x="60" y="158" width="348" height="269"/></clipPath></defs><rect x="60" y="158" width="348" height="269" fill="none" stroke="#e5534b" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="455" font-size="15" fill="#8fa3bd">裁掉左右各约 149px</text><text x="60" y="478" font-size="15" fill="#8fa3bd">标题容易被裁断</text><text x="560" y="140" font-size="18" fill="#3fb950">✓ 630×487（比例 1.294 : 1，与 348×269 一致）</text><rect x="560" y="158" width="348" height="269" fill="#20344c" stroke="#3fb950" stroke-width="2"/><g transform="translate(560,158) scale(0.5523809523809524)" clip-path="url(#clipR)"><rect width="630" height="487" fill="url(#g2)"/><rect x="265" y="92" width="175" height="175" rx="18" fill="#3fa9f5" opacity="0.85"/><rect x="448" y="180" width="95" height="95" rx="12" fill="#ffffff" opacity="0.9"/><rect x="58" y="288" width="6" height="58" fill="#3fa9f5" rx="3"/><text x="82" y="332" font-size="46" font-weight="bold" fill="#fff">按 = 出答案</text><text x="84" y="378" font-size="23" fill="#3fa9f5">AutoHotkey v2</text></g><defs><clipPath id="clipR"><rect x="560" y="158" width="348" height="269"/></clipPath><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1a2b"/><stop offset="100%" stop-color="#16395c"/></linearGradient></defs><text x="560" y="455" font-size="15" fill="#8fa3bd">等比缩放，一个像素都不裁</text><text x="560" y="478" font-size="15" fill="#8fa3bd">烘焙进去的文字位置就是最终位置</text><text x="40" y="560" font-size="17" fill="#e8eef7">结论：封面尺寸不是「随便一张横图」，而应该直接按卡片可视区比例出图。</text><text x="40" y="590" font-size="15" fill="#8fa3bd">348 / 269 ≈ 1.2937 → 630 / 487 ≈ 1.2936，两者比值一样，缩放不会变形也不会裁切。</text></svg>