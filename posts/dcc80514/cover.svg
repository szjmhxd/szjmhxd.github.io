  <line x1="80" y1="430" x2="1120" y2="430" stroke="#ffa94d" stroke-opacity="0.22" stroke-width="1"/>
  <text x="80" y="462" font-size="16" fill="#ffffff" opacity="0.4" font-family="Consolas, monospace">szjmhxd</text>
