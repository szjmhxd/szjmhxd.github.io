<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- 浏览器 -->
  <rect x="30" y="20" width="176" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="118" y="45" text-anchor="middle" font-size="14" fill="#1f2328" font-weight="600">浏览器</text>
  <text x="118" y="65" text-anchor="middle" font-size="11.5" fill="#57606a">noVNC / WebUI</text>

  <!-- 连接线 -->
  <line x1="118" y1="80" x2="118" y2="140" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="118,140 114,132 122,132" fill="#8c959f"/>
  <text x="128" y="103" font-size="11.5" fill="#57606a">:6081</text>
  <text x="128" y="120" font-size="11.5" fill="#57606a">:5099</text>

  <!-- SnowLuma 容器 -->
  <rect x="30" y="140" width="310" height="230" rx="10" fill="#eef6ff" stroke="#79b8ff" stroke-width="1.6"/>
  <text x="46" y="166" font-size="13.5" fill="#0a3069" font-weight="600">snowluma 容器</text>

  <rect x="46" y="180" width="278" height="48" rx="6" fill="#ffffff" stroke="#b6d7ff" stroke-width="1.2"/>
  <text x="58" y="200" font-size="12" fill="#1f2328">Xvfb :1 + QQ 客户端</text>
  <text x="58" y="218" font-size="11" fill="#57606a">扫码登录，ptrace 注入</text>

  <rect x="46" y="240" width="278" height="48" rx="6" fill="#ffffff" stroke="#b6d7ff" stroke-width="1.2"/>
  <text x="58" y="260" font-size="12" fill="#1f2328">SnowLuma 主进程</text>
  <text x="58" y="278" font-size="11" fill="#57606a">WebUI :5099 · noVNC :6081</text>

  <rect x="46" y="300" width="278" height="52" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="58" y="321" font-size="12" fill="#1f2328" font-weight="600">OneBot · WS 客户端（出站）</text>
  <text x="58" y="339" font-size="11" fill="#57606a">配置在 onebot_&lt;uin&gt;.json 的 wsClients</text>

  <!-- botnet 网络 -->
  <rect x="366" y="118" width="152" height="274" rx="8" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="442" y="140" text-anchor="middle" font-size="11.5" fill="#57606a" font-weight="600">docker network</text>
  <text x="442" y="156" text-anchor="middle" font-size="11.5" fill="#57606a">botnet</text>
  <text x="442" y="172" text-anchor="middle" font-size="10.5" fill="#8c959f">172.25.0.0/16</text>

  <!-- 出站 WS 箭头 -->
  <line x1="324" y1="326" x2="566" y2="326" stroke="#1a7f37" stroke-width="2"/>
  <polygon points="566,326 556,321 556,331" fill="#1a7f37"/>
  <text x="446" y="308" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="600">ws://astrbot:6199/ws</text>
  <text x="446" y="348" text-anchor="middle" font-size="10.5" fill="#8c959f">反向 WebSocket</text>

  <!-- AstrBot 容器 -->
  <rect x="575" y="140" width="300" height="230" rx="10" fill="#f0f9f2" stroke="#7ee2b8" stroke-width="1.6"/>
  <text x="591" y="166" font-size="13.5" fill="#0a3622" font-weight="600">astrbot 容器</text>

  <rect x="591" y="180" width="268" height="48" rx="6" fill="#ffffff" stroke="#a7e8c8" stroke-width="1.2"/>
  <text x="603" y="200" font-size="12" fill="#1f2328">AstrBot WebUI</text>
  <text x="603" y="218" font-size="11" fill="#57606a">:6185</text>

  <rect x="591" y="240" width="268" height="66" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="603" y="261" font-size="12" fill="#1f2328" font-weight="600">aiocqhttp 适配器</text>
  <text x="603" y="279" font-size="11" fill="#57606a">反向 WS 服务端 0.0.0.0:6199</text>
  <text x="603" y="296" font-size="10.5" fill="#8c959f">只能当服务端，不会主动外连</text>

  <rect x="591" y="316" width="268" height="38" rx="6" fill="#ffffff" stroke="#a7e8c8" stroke-width="1.2"/>
  <text x="603" y="340" font-size="11.5" fill="#1f2328">消息处理 / 插件 / TTS</text>

  <!-- 到 LLM -->
  <line x1="725" y1="370" x2="725" y2="404" stroke="#8c959f" stroke-width="1.5"/>
  <polygon points="725,404 721,396 729,396" fill="#8c959f"/>

  <rect x="575" y="404" width="300" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="725" y="424" text-anchor="middle" font-size="12" fill="#1f2328">大模型 API</text>
  <text x="725" y="441" text-anchor="middle" font-size="10.5" fill="#57606a">OpenAI 兼容 / 国内厂商</text>

  <!-- 图例 -->
  <text x="30" y="424" font-size="11" fill="#1a7f37" font-weight="600">━ 出站 WebSocket（唯一的数据通路）</text>
  <text x="30" y="443" font-size="11" fill="#57606a">QQ 消息：QQ ← 进程注入 ← SnowLuma ←WS→ AstrBot</text>
</svg>
