  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>

  <!-- 装饰网格 -->
  <g stroke="#4da6ff" stroke-opacity="0.09" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/><line x1="900" y1="0" x2="900" y2="500"/><line x1="1000" y1="0" x2="1000" y2="500"/><line x1="1100" y1="0" x2="1100" y2="500"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- 装饰圆环 -->
  <circle cx="1000" cy="250" r="180" fill="none" stroke="#4da6ff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="1000" cy="250" r="130" fill="none" stroke="#4da6ff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- 主图标 -->
  <g transform="translate(880, 130) scale(3.1)" fill="none" stroke="#4da6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M24 8 L24 14 M24 34 L24 40 M8 24 L14 24 M34 24 L40 24 M13 13 L17 17 M31 31 L35 35 M35 13 L31 17 M17 31 L13 35 M24 16 A8 8 0 1 0 24 32 A8 8 0 1 0 24 16"/>
  </g>

  <!-- 文字区 -->
  <g>
    <rect x="80" y="120" width="6" height="56" fill="#4da6ff" rx="3"/>
    <text x="106" y="164" font-size="50" font-weight="bold" fill="#ffffff">CBS 服务栈修复</text>
    <text x="108" y="212" font-size="23" fill="#4da6ff" opacity="0.88">Windows Update 彻底失效之后</text>

    <g font-size="17" fill="#ffffff" opacity="0.55" font-family="Consolas, Monaco, monospace">
      <text x="108" y="290">· 0x800700c1</text><text x="108" y="322">· DISM 193</text><text x="108" y="354">· WinSxS</text>
