      <stop offset="0%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0"/>
