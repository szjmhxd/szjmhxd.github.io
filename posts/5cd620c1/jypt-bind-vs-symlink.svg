<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#8a97a4"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">为什么软链接在容器里会断链：软链 vs bind mount</text>

  <!-- LEFT: symlink (wrong) -->
  <rect x="30" y="62" width="440" height="500" rx="10" fill="#fdf5f5" stroke="#e0b4b4" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b34a4a">✗ 软链接 ln -s</text>

  <rect x="55" y="110" width="390" height="60" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="72" y="134" font-size="12.5" font-weight="bold" fill="#33507a">宿主机视角</text>
  <text x="72" y="156" font-size="11.5" fill="#4a5a6a">/opt/1panel/www/sites → /home/szjm/Documents</text>

  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#52a675">宿主机上一读写全正常 ✓</text>
  <line x1="250" y1="200" x2="250" y2="228" stroke="#8a97a4" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="262" y="219" font-size="11" fill="#8a97a4">进入容器命名空间</text>

  <rect x="55" y="232" width="390" height="150" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="72" y="256" font-size="12.5" font-weight="bold" fill="#33507a">容器视角（php / openresty）</text>
  <text x="72" y="280" font-size="11.5" fill="#4a5a6a">软链存的是目标路径字符串</text>
  <text x="72" y="301" font-size="11.5" fill="#4a5a6a">容器内解析 /home/szjm/Documents</text>
  <text x="72" y="322" font-size="11.5" font-weight="bold" fill="#b34a4a">→ 该路径在容器里根本不存在</text>
  <text x="72" y="345" font-size="11" fill="#7b8794">只挂了 /opt/1panel/www → /www</text>
  <text x="72" y="366" font-size="11" fill="#7b8794">挂载范围之外的路径不可见</text>

  <rect x="55" y="396" width="390" height="86" rx="6" fill="#fff0f0" stroke="#dda3a3"/>
  <text x="72" y="420" font-size="11.5" font-weight="bold" fill="#b34a4a">症状</text>
  <text x="72" y="441" font-size="11" fill="#8a5a5a">nginx: [emerg] open() "/www/sites/…/rewrite/…conf"</text>
  <text x="72" y="460" font-size="11" fill="#8a5a5a">failed (2: No such file or directory) → 容器反复 restarting</text>
  <text x="72" y="477" font-size="11" fill="#8a5a5a">php 容器 ls /www/sites 报不存在</text>

  <text x="250" y="514" text-anchor="middle" font-size="12" fill="#b34a4a" font-weight="bold">结论：挂载点内放软链指向挂载范围外，必然失效</text>
  <text x="250" y="538" text-anchor="middle" font-size="11" fill="#8a5a5a">软链在宿主机解析，容器看不到目标</text>

  <!-- RIGHT: bind mount (correct) -->
  <rect x="490" y="62" width="440" height="500" rx="10" fill="#f4fbf6" stroke="#a8d0b6" stroke-width="2"/>
  <text x="710" y="90" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2f7a4d">✓ bind 挂载 mount --bind</text>

  <rect x="515" y="110" width="390" height="60" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="532" y="134" font-size="12.5" font-weight="bold" fill="#33507a">宿主机执行</text>
  <text x="532" y="156" font-size="11.5" fill="#4a5a6a">mount --bind /home/szjm/Documents /opt/1panel/www/sites</text>

  <text x="710" y="192" text-anchor="middle" font-size="12" fill="#52a675">由宿主机内核完成目录绑定</text>
  <line x1="710" y1="200" x2="710" y2="228" stroke="#8a97a4" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="722" y="219" font-size="11" fill="#8a97a4">进入容器命名空间</text>

  <rect x="515" y="232" width="390" height="150" rx="6" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="532" y="256" font-size="12.5" font-weight="bold" fill="#33507a">容器视角</text>
  <text x="532" y="280" font-size="11.5" fill="#4a5a6a">/www/sites 就是一个普通目录</text>
  <text x="532" y="301" font-size="11.5" fill="#4a5a6a">内容 = 宿主机 /home/szjm/Documents</text>
  <text x="532" y="322" font-size="11.5" font-weight="bold" fill="#2f7a4d">→ 容器内看到真实目录树 ✓</text>
  <text x="532" y="345" font-size="11" fill="#7b8794">无需容器内存在 /home/szjm 路径</text>
  <text x="532" y="366" font-size="11" fill="#7b8794">重启不丢：写 /etc/fstab + mount -a 校验</text>

  <rect x="515" y="396" width="390" height="86" rx="6" fill="#eefaf2" stroke="#a8d0b6"/>
  <text x="532" y="420" font-size="11.5" font-weight="bold" fill="#2f7a4d">验证三连</text>
  <text x="532" y="441" font-size="11" fill="#3f6b52">ls /opt/1panel/www/sites/</text>
  <text x="532" y="460" font-size="11" fill="#3f6b52">docker exec 1Panel-openresty-gw6h ls /www/sites/</text>
  <text x="532" y="479" font-size="11" fill="#3f6b52">docker exec php8335 ls /www/sites/bgpt_python</text>

  <text x="710" y="514" text-anchor="middle" font-size="12" fill="#2f7a4d" font-weight="bold">权限附带坑：容器 www-data uid=1000</text>
  <text x="710" y="538" text-anchor="middle" font-size="11" fill="#3f6b52">宿主机无 www 用户；uid 对齐时保持 szjm:szjm 即可</text>
</svg>
