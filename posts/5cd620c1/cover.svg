<svg xmlns="http://www.w3.org/2000/svg" width="630" height="630" viewBox="0 0 630 630" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1b2e"/>
      <stop offset="100%" stop-color="#4a2c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="630" height="630" fill="url(#bg)"/>
  <rect width="630" height="630" fill="url(#glow)"/>

  <!-- 网格 -->
  <g stroke="#ff6b6b" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="100" y1="0" x2="100" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="500" y1="0" x2="500" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="0" x2="630" y2="0"/><line x1="0" y1="100" x2="630" y2="100"/><line x1="0" y1="200" x2="630" y2="200"/><line x1="0" y1="300" x2="630" y2="300"/><line x1="0" y1="400" x2="630" y2="400"/><line x1="0" y1="500" x2="630" y2="500"/><line x1="0" y1="600" x2="630" y2="600"/>
  </g>

  <!-- 装饰圆环（右上方，作背景） -->
  <circle cx="500" cy="150" r="185" fill="none" stroke="#ff6b6b" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="500" cy="150" r="130" fill="none" stroke="#ff6b6b" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- 图标：右上 -->
  <g transform="translate(438, 88) scale(2.5)" fill="none" stroke="#ff6b6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M24 12 V18 M12 20 H36 M14 20 L10 32 M34 20 L38 32 M18 12 L14 6 M30 12 L34 6 M12 20 A12 12 0 0 0 36 20 A12 12 0 0 0 12 20 M16 26 H32"/>
  </g>

  <!-- 文字：左侧居中，字号加大 -->
  <g>
    <rect x="58" y="368" width="6" height="62" fill="#ff6b6b" rx="3"/>
    <text x="82" y="416" font-size="58" font-weight="bold" fill="#ffffff" letter-spacing="1">Laravel</text>
    <text x="84" y="468" font-size="34" fill="#ff6b6b" opacity="0.92">部署排障</text>
  </g>

  <!-- 底部装饰线 -->
  <line x1="58" y1="520" x2="572" y2="520" stroke="#ff6b6b" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
