    <rect x="80" y="120" width="6" height="56" fill="#ff6b6b" rx="3"/>
    <text x="106" y="164" font-size="50" font-weight="bold" fill="#ffffff">Laravel 部署排障</text>
    <text x="108" y="212" font-size="23" fill="#ff6b6b" opacity="0.88">Docker · 1Panel · OpenResty</text>

    <g font-size="17" fill="#ffffff" opacity="0.55" font-family="Consolas, Monaco, monospace">
      <text x="108" y="290">· bootstrap/cache</text><text x="108" y="322">· Passport</text><text x="108" y="354">· bind mount</text>
