      <stop offset="0%" stop-color="#2d1b2e"/>
      <stop offset="100%" stop-color="#4a2c45"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>

  <!-- 装饰网格 -->
  <g stroke="#ff6b6b" stroke-opacity="0.09" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/><line x1="900" y1="0" x2="900" y2="500"/><line x1="1000" y1="0" x2="1000" y2="500"/><line x1="1100" y1="0" x2="1100" y2="500"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- 装饰圆环 -->
  <circle cx="1000" cy="250" r="180" fill="none" stroke="#ff6b6b" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="1000" cy="250" r="130" fill="none" stroke="#ff6b6b" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- 主图标 -->
  <g transform="translate(880, 130) scale(3.1)" fill="none" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M24 12 V18 M12 20 H36 M14 20 L10 32 M34 20 L38 32 M18 12 L14 6 M30 12 L34 6 M12 20 A12 12 0 0 0 36 20 A12 12 0 0 0 12 20 M16 26 H32"/>
